name: documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zensical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Zensical
        run: python -m pip install zensical
      - name: Build documentation
        run: zensical build
